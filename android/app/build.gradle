plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghostlink.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ghostlink.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '3.0'
    }

    // Development signing key kept in the repo so every build (Android Studio, GitHub Actions,
    // Claude) can install over the previous one. For the Play Store, create a private key instead.
    signingConfigs {
        ghostlink {
            storeFile rootProject.file('keystore/ghostlink.jks')
            storePassword 'ghostlink'
            keyAlias 'ghostlink'
            keyPassword 'ghostlink'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ghostlink
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.ghostlink
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// The web app lives at the repository root: copy it into the APK assets before every build.
def webAssets = file('src/main/assets/www')
tasks.register('copyWebApp', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'manifest.webmanifest', 'css/**', 'js/**', 'fonts/**', 'icons/**', 'vendor/**'
    }
    into webAssets
}
preBuild.dependsOn 'copyWebApp'
