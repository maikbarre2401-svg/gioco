plugins {
    id 'com.android.application'
}

android {
    namespace 'it.zeph.compagno'
    compileSdk 34

    defaultConfig {
        applicationId 'it.zeph.compagno'
        minSdk 26
        targetSdk 34
        // su GitHub il numero cresce a ogni compilazione: così l'aggiornamento si installa sopra
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName '6.0'
    }

    // firma fissa (facoltativa): se nei segreti di GitHub c'è ZEPH_KEYSTORE, ogni versione
    // ha la stessa firma e si installa sopra la precedente senza perdere la memoria
    def ks = System.getenv('ZEPH_KEYSTORE_FILE')
    if (ks && file(ks).exists()) {
        signingConfigs {
            zeph {
                storeFile file(ks)
                storePassword System.getenv('ZEPH_KEYSTORE_PASSWORD')
                keyAlias 'zeph'
                keyPassword System.getenv('ZEPH_KEYSTORE_PASSWORD')
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.zeph }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // le pagine web e le librerie 3D vengono copiate dal resto del progetto
    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('zephWeb').get().asFile
        }
    }
}

// Copia nell'app: la pagina dell'overlay (android/web), il motore 3D, la pagina
// dell'avatar dalla foto, l'SDK di Claude (usato solo con la tua chiave) e,
// se passato con -PzephAvatar=percorso/avatar.glb, il tuo avatar.
def zephWebOut = layout.buildDirectory.dir('zephWeb').get().asFile
def repoRoot = rootProject.file('..')
tasks.register('zephWebAssets', Sync) {
    from(new File(repoRoot, 'three.min.js'))
    from(new File(repoRoot, 'gltf-loader.js'))
    from(new File(repoRoot, 'zeph-core.js'))
    from(new File(repoRoot, 'anthropic-sdk.js'))
    from(new File(repoRoot, 'foto.html'))
    from(new File(repoRoot, 'foto.js'))
    from(new File(repoRoot, 'occhi.html'))
    from(new File(repoRoot, 'occhi.js'))
    from(rootProject.file('web'))
    def av = project.findProperty('zephAvatar')
    if (av) {
        from(file(av)) { rename { 'avatar.glb' } }
    }
    into zephWebOut
}
preBuild.dependsOn 'zephWebAssets'
tasks.configureEach { t ->
    if (t.name.startsWith('merge') && t.name.endsWith('Assets')) t.dependsOn 'zephWebAssets'
}
