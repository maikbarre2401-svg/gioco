name: Scarica una citta' vera (OpenStreetMap)

on:
  workflow_dispatch:
    inputs:
      nome:
        description: "Nome del file (es. losangeles, milano, roma)"
        default: "losangeles"
      lat:
        description: "Latitudine del centro"
        default: "34.0490"
      lon:
        description: "Longitudine del centro"
        default: "-118.2560"
      raggio:
        description: "Mezzo lato dell'area in metri"
        default: "1300"

permissions:
  contents: write

concurrency:
  group: fetch-city-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica strade ed edifici
        run: |
          python tools/fetch_osm.py \
            --nome "${{ github.event.inputs.nome || 'losangeles' }}" \
            --lat "${{ github.event.inputs.lat || '34.0490' }}" \
            --lon "${{ github.event.inputs.lon || '-118.2560' }}" \
            --raggio "${{ github.event.inputs.raggio || '1300' }}"

      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add citta/
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Dati citta' da OpenStreetMap (c) OpenStreetMap contributors, ODbL"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep $((i * 5))
            done
          fi
