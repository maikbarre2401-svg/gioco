name: Crea gli eseguibili Windows (.exe)

on:
  push:
    paths:
      - "rick_morty_3d.py"
      - "rick_and_morty.py"
      - "tools/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install panda3d numpy pygame pyinstaller pillow

      - name: Controllo del codice
        run: |
          python -c "import ast; ast.parse(open('rick_morty_3d.py', encoding='utf-8').read()); ast.parse(open('rick_and_morty.py', encoding='utf-8').read()); print('sintassi ok')"
          python -c "import panda3d.core, numpy; print('panda3d', panda3d.__version__)"

      - name: Prova veloce del gioco 2D (senza finestra)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -c "import rick_and_morty as g; game = g.Game(); [game.step(1/60) for _ in range(60)]; print('ok')"

      - name: Crea icona
        run: python tools/make_icon.py

      - name: Crea RickAndMorty3D.exe (open world 3D)
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name RickAndMorty3D --icon icon.ico --collect-binaries panda3d --hidden-import panda3d.core rick_morty_3d.py

      - name: Crea RickAndMorty2D.exe (platform 2D)
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name RickAndMorty2D --icon icon.ico rick_and_morty.py

      - name: Carica gli eseguibili
        uses: actions/upload-artifact@v4
        with:
          name: RickAndMorty-Windows
          path: |
            dist/RickAndMorty3D.exe
            dist/RickAndMorty2D.exe
          if-no-files-found: error
