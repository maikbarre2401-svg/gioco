# Crea l'APK di Zeph per Android a ogni modifica e lo pubblica nella pagina
# Releases del repository: da lì lo scarichi direttamente sul telefono.
name: Zeph per Android

on:
  push:
    paths:
      - 'android/**'
      - 'zeph-core.js'
      - 'three.min.js'
      - 'gltf-loader.js'
      - 'anthropic-sdk.js'
      - 'foto.html'
      - 'foto.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Crea l'APK
        run: python3 android/crea_apk.py --ci

      - uses: actions/upload-artifact@v4
        with:
          name: Zeph-apk
          path: Zeph.apk

      - name: Pubblica l'APK nella pagina Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android Zeph.apk \
            --target "$GITHUB_SHA" \
            --title "Zeph per Android" \
            --prerelease \
            --notes "Scarica **Zeph.apk** qui sotto direttamente dal telefono e aprilo per installarlo (Android ti chiederà di permettere l'installazione da questa fonte). Creato da \`${GITHUB_SHA::7}\` sul branch \`${GITHUB_REF_NAME}\`."
