# Crea l'APK di Zeph per Android a ogni modifica e lo pubblica nella pagina
# Releases del repository: da lì lo scarichi direttamente sul telefono.
name: Zeph per Android

on:
  push:
    paths:
      - 'android/**'
      - 'zeph-core.js'
      - 'three.min.js'
      - 'gltf-loader.js'
      - 'anthropic-sdk.js'
      - 'foto.html'
      - 'foto.js'
      - 'occhi.html'
      - 'occhi.js'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # prima di creare l'APK: i test del cervello (se qualcosa si rompe, niente APK difettoso)
      - name: Prova il cervello di Zeph
        run: node --test tests/cervello.test.js

      # facoltativo: con i segreti ZEPH_KEYSTORE (keystore in base64) e ZEPH_KEYSTORE_PASSWORD
      # ogni APK ha la stessa firma, quindi si aggiorna sopra il vecchio senza disinstallare
      - name: Chiave di firma fissa (se configurata)
        env:
          KS: ${{ secrets.ZEPH_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/zeph.keystore"
            echo "ZEPH_KEYSTORE_FILE=$RUNNER_TEMP/zeph.keystore" >> "$GITHUB_ENV"
            echo "Firma fissa attiva"
          else
            echo "Nessuna firma fissa: si usa la chiave di debug"
          fi

      - name: Crea l'APK
        env:
          ZEPH_KEYSTORE_PASSWORD: ${{ secrets.ZEPH_KEYSTORE_PASSWORD }}
        run: python3 android/crea_apk.py --ci

      - uses: actions/upload-artifact@v4
        with:
          name: Zeph-apk
          path: Zeph.apk

      - name: Pubblica l'APK nella pagina Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android Zeph.apk \
            --target "$GITHUB_SHA" \
            --title "Zeph per Android · build ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes "Scarica **Zeph.apk** qui sotto direttamente dal telefono e aprilo per installarlo (Android ti chiederà di permettere l'installazione da questa fonte). Creato da \`${GITHUB_SHA::7}\` sul branch \`${GITHUB_REF_NAME}\`."
