name: APK Android

on:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'fonts/**'
      - 'icons/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila l'APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepara il file
        run: cp android/app/build/outputs/apk/release/app-release.apk ghostlink.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ghostlink-apk
          path: ghostlink.apk

      - name: Pubblica nella release "ultima-versione"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versione --yes --cleanup-tag || true
          gh release create ultima-versione ghostlink.apk \
            --target "$GITHUB_SHA" \
            --title "Ghostlink (ultima versione)" \
            --notes "APK compilato automaticamente dal commit ${GITHUB_SHA::7} sul branch ${GITHUB_REF_NAME}. Scaricalo dal telefono e aprilo per installarlo."
