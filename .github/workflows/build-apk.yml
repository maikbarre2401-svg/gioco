name: Build APK (Python / Kivy)

on:
  push:
    paths:
      - "python-apk/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev zip unzip

      - name: Install Buildozer
        run: pip install --upgrade buildozer "cython<3.1" setuptools

      - name: Unit tests
        working-directory: python-apk
        run: python -m unittest test_store

      - name: Cache Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            python-apk/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('python-apk/buildozer.spec') }}

      - name: Build APK
        working-directory: python-apk
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: maik-subs-apk
          path: python-apk/bin/*.apk
