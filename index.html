<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zeph — il tuo compagno 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#87b8e8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #scene3d { position:fixed; inset:0; touch-action:none; }
  #scene3d canvas { display:block; }

  .panel { position:fixed; z-index:10; background:rgba(13,22,38,.78);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,.12); border-radius:16px; color:#eaf2ff; }

  #brand { top:14px; left:14px; padding:12px 16px; max-width:280px; }
  #brand h1 { font-size:20px; letter-spacing:2px; color:#5eead4; }
  #brand h1 span { color:#eaf2ff; font-weight:300; }
  #brand .sub { font-size:11.5px; opacity:.75; margin-top:2px; }
  #status { margin-top:8px; font-size:13px; display:flex; align-items:center; gap:7px; }
  #status .dot { width:8px; height:8px; border-radius:50%; background:#5eead4;
    box-shadow:0 0 8px #5eead4; flex:none; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  #hints { margin-top:8px; font-size:10.5px; line-height:1.7; opacity:.62; }

  #chatbar { bottom:14px; left:50%; transform:translateX(-50%); width:min(560px, calc(100% - 20px));
    padding:10px; display:flex; flex-direction:column; gap:8px; }
  #chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.07);
    color:#eaf2ff; border-radius:999px; padding:6px 12px; font-size:12.5px; cursor:pointer;
    transition:background .15s, transform .05s; user-select:none; }
  .chip:hover { background:rgba(94,234,212,.22); }
  .chip:active { transform:scale(.96); }
  .chip.on { background:#14b8a6; border-color:#14b8a6; color:#04222c; font-weight:600; }
  #inputrow { display:flex; gap:8px; }
  #msg { flex:1; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.08);
    color:#fff; border-radius:12px; padding:11px 14px; font-size:14px; outline:none; }
  #msg::placeholder { color:rgba(255,255,255,.45); }
  #msg:focus { border-color:#5eead4; }
  #send { border:none; background:#14b8a6; color:#04222c; font-weight:700; font-size:14px;
    border-radius:12px; padding:0 20px; cursor:pointer; transition:filter .15s; }
  #send:hover { filter:brightness(1.15); }

  #bubble { position:fixed; z-index:9; max-width:260px; background:#fff; color:#1e293b;
    border-radius:14px; padding:10px 14px; font-size:14px; line-height:1.45;
    box-shadow:0 6px 24px rgba(0,0,0,.25); opacity:0; transform:translate(-50%,-100%) scale(.85);
    transition:opacity .18s, transform .18s; pointer-events:none; }
  #bubble.show { opacity:1; transform:translate(-50%,-100%) scale(1); }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-7px; margin-left:-7px;
    border-left:7px solid transparent; border-right:7px solid transparent; border-top:8px solid #fff; }

  #mutebtn { top:14px; right:14px; padding:9px 12px; font-size:17px; cursor:pointer;
    user-select:none; transition:background .15s; }
  #mutebtn:hover { background:rgba(13,22,38,.95); }

  @media (max-width:600px) {
    #brand { max-width:210px; padding:10px 12px; }
    #brand h1 { font-size:16px; }
    #hints { display:none; }
  }
</style>
</head>
<body>
<div id="scene3d"></div>

<div class="panel" id="brand">
  <h1>ZEPH <span>· 3D</span></h1>
  <div class="sub">Il tuo compagno virtuale che parla e cammina</div>
  <div id="status"><div class="dot"></div><span id="statustext">Sto arrivando…</span></div>
  <div id="hints">
    🖱️ Clic sul prato → cammina lì<br>
    ⌨️ WASD / frecce → guidalo tu<br>
    ✋ Trascina → ruota la visuale · rotella → zoom<br>
    💬 Scrivigli in basso: ti risponde a voce!
  </div>
</div>

<div class="panel" id="mutebtn" title="Attiva/disattiva la voce">🔊</div>

<div class="panel" id="chatbar">
  <div id="chips">
    <div class="chip" data-cmd="saluta">👋 Saluta</div>
    <div class="chip" data-cmd="balla">💃 Balla</div>
    <div class="chip" data-cmd="salta">🦘 Salta</div>
    <div class="chip" data-cmd="barzelletta">😂 Barzelletta</div>
    <div class="chip" id="wanderchip">🚶 Passeggia da solo</div>
  </div>
  <div id="inputrow">
    <input id="msg" type="text" placeholder="Scrivi qualcosa a Zeph… (es. «ciao», «come stai?», «balla!»)" autocomplete="off">
    <button id="send">Invia</button>
  </div>
</div>

<div id="bubble"></div>

<script src="./three.min.js"></script>
<script>
// se la copia locale manca (es. file scaricato da solo), usa il CDN
if (typeof THREE === 'undefined') {
  document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"><\/script>');
}
</script>
<script src="./zeph-core.js"></script>
<script>
/* ============================================================
   ZEPH nel browser — scena, movimento, camera, voce e chat.
   Il personaggio e le animazioni vivono in zeph-core.js.
   ============================================================ */
(function () {
'use strict';

// ---------- Scena base ----------
const container = document.getElementById('scene3d');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd0f5);
scene.fog = new THREE.Fog(0x9fd0f5, 26, 60);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);

const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6fae54, 0.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 1.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9;   sun.shadow.camera.bottom = -9;
sun.shadow.camera.near = 1;  sun.shadow.camera.far = 40;
sun.shadow.bias = -0.002;
scene.add(sun); scene.add(sun.target);
const rim = new THREE.DirectionalLight(0xbcd7ff, 0.35);
rim.position.set(-4, 6, -6);
scene.add(rim);

// ---------- Terreno ed elementi di contorno ----------
function grassTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#6fae54'; g.fillRect(0, 0, 256, 256);
  const shades = ['#7cbf60', '#659e4b', '#86c96a', '#5d9445', '#74b35a'];
  for (let i = 0; i < 1400; i++) {
    g.fillStyle = shades[(Math.random() * shades.length) | 0];
    g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(12, 12);
  t.encoding = THREE.sRGBEncoding;
  return t;
}
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(34, 48),
  new THREE.MeshStandardMaterial({ map: grassTexture(), roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// generatore pseudo-casuale con seme fisso: scenografia sempre uguale
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260716);

function addTree(x, z, s) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.14 * s, 0.2 * s, 1.1 * s, 7),
    new THREE.MeshStandardMaterial({ color: 0x7a5236, roughness: 1 })
  );
  trunk.position.y = 0.55 * s; trunk.castShadow = true;
  tree.add(trunk);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3e8948, roughness: 1 });
  [[0, 1.55, 0, 0.75], [0.42, 1.25, 0.1, 0.5], [-0.38, 1.3, -0.15, 0.45]].forEach(p => {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(p[3] * s, 10, 8), leafMat);
    leaf.position.set(p[0] * s, p[1] * s, p[2] * s);
    leaf.castShadow = true;
    tree.add(leaf);
  });
  tree.position.set(x, 0, z);
  scene.add(tree);
}
function addRock(x, z, s) {
  const rock = new THREE.Mesh(
    new THREE.IcosahedronGeometry(s, 0),
    new THREE.MeshStandardMaterial({ color: 0x9aa0a8, roughness: 1 })
  );
  rock.position.set(x, s * 0.4, z);
  rock.scale.y = 0.62;
  rock.rotation.y = rng() * Math.PI;
  rock.castShadow = true;
  scene.add(rock);
}
for (let i = 0; i < 11; i++) {
  const a = rng() * Math.PI * 2, r = 9 + rng() * 21;
  addTree(Math.sin(a) * r, Math.cos(a) * r, 0.85 + rng() * 0.7);
}
for (let i = 0; i < 7; i++) {
  const a = rng() * Math.PI * 2, r = 6 + rng() * 22;
  addRock(Math.sin(a) * r, Math.cos(a) * r, 0.25 + rng() * 0.4);
}
const clouds = [];
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
for (let i = 0; i < 6; i++) {
  const cl = new THREE.Group();
  for (let j = 0; j < 3; j++) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(1.1 + rng() * 0.9, 8, 6), cloudMat);
    puff.position.set(j * 1.5 - 1.5, rng() * 0.4, rng() * 0.8);
    puff.scale.y = 0.55;
    cl.add(puff);
  }
  cl.position.set(rng() * 70 - 35, 12 + rng() * 5, rng() * 60 - 30);
  scene.add(cl); clouds.push(cl);
}

// ---------- Zeph ----------
const zeph = ZephCore.build(THREE);
const anim = new ZephCore.Animator(zeph);
scene.add(zeph.root);
const HIP_Y = ZephCore.HIP_Y;

const state = {
  pos: new THREE.Vector3(0, 0, 2),
  heading: Math.PI,          // guarda verso la camera all'avvio
  speed: 0,
  target: null,              // punto cliccato verso cui camminare
  keys: {},
  wander: false, nextWanderAt: 4,
  interacted: false, muted: false,
};
const WALK_SPEED = 2.0;

// ---------- Movimento ----------
function updateMovement(dt) {
  let dir = null;

  const k = state.keys;
  let kx = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
  let kz = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0);
  if (kx || kz) {
    state.target = null;
    // direzione relativa alla camera
    const f = new THREE.Vector3(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw));
    const r = new THREE.Vector3(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw));
    dir = f.multiplyScalar(kz).add(r.multiplyScalar(kx)).normalize();
  } else if (state.target) {
    const d = new THREE.Vector3().subVectors(state.target, state.pos); d.y = 0;
    if (d.length() < 0.14) state.target = null;
    else dir = d.normalize();
  }

  const act = anim.state.action;
  const blocked = act && act.name !== 'wave';
  const targetSpeed = (dir && !blocked) ? WALK_SPEED : 0;
  state.speed += (targetSpeed - state.speed) * Math.min(1, dt * 6);
  if (state.speed < 0.01) state.speed = 0;

  if (dir && !blocked) {
    state.heading = lerpAngle(state.heading, Math.atan2(dir.x, dir.z), Math.min(1, dt * 8));
  } else if ((anim.state.talking || (act && act.name === 'wave')) && state.speed < 0.2) {
    // si gira verso di te quando parla o saluta
    const toCam = Math.atan2(camera.position.x - state.pos.x, camera.position.z - state.pos.z);
    state.heading = lerpAngle(state.heading, toCam, Math.min(1, dt * 3));
  }

  if (state.speed > 0.01) {
    state.pos.x += Math.sin(state.heading) * state.speed * dt;
    state.pos.z += Math.cos(state.heading) * state.speed * dt;
    const rad = Math.hypot(state.pos.x, state.pos.z);
    if (rad > 26) { state.pos.x *= 26 / rad; state.pos.z *= 26 / rad; state.target = null; }
    anim.state.phase += state.speed * dt * (Math.PI / 0.7);
  }
  anim.state.speedRatio = state.speed / WALK_SPEED;

  zeph.root.position.copy(state.pos);
  zeph.root.rotation.y = state.heading;
}

function lerpAngle(a, b, k) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * k;
}

// passeggiata autonoma
function updateWander(t) {
  if (!state.wander || state.target || state.speed > 0.1 || anim.state.talking || anim.state.action) return;
  if (t > state.nextWanderAt) {
    const a = Math.random() * Math.PI * 2, r = 3 + Math.random() * 14;
    state.target = new THREE.Vector3(Math.sin(a) * r, 0, Math.cos(a) * r);
    state.nextWanderAt = t + 4 + Math.random() * 5;
    if (state.interacted && Math.random() < 0.35) {
      speak(ZephCore.pick(ZephCore.FRASI_PASSEGGIO));
    }
  }
}

// ---------- Camera ----------
const cam = { yaw: 0, pitch: 0.4, dist: 4.8, focus: new THREE.Vector3() };
function updateCamera(dt) {
  const targetFocus = new THREE.Vector3(state.pos.x, 1.0, state.pos.z);
  cam.focus.lerp(targetFocus, Math.min(1, dt * 5));
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  camera.position.set(
    cam.focus.x + Math.sin(cam.yaw) * cp * cam.dist,
    cam.focus.y + sp * cam.dist,
    cam.focus.z + Math.cos(cam.yaw) * cp * cam.dist
  );
  camera.lookAt(cam.focus);
  sun.position.set(state.pos.x + 7, 13, state.pos.z + 5);
  sun.target.position.set(state.pos.x, 0, state.pos.z);
}

// ---------- Input: trascina per ruotare, clic per camminare ----------
const raycaster = new THREE.Raycaster();
const pt = { down: false, dragged: false, x: 0, y: 0, id: -1 };
const el = renderer.domElement;

el.addEventListener('pointerdown', e => {
  state.interacted = true;
  pt.down = true; pt.dragged = false; pt.x = e.clientX; pt.y = e.clientY; pt.id = e.pointerId;
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e => {
  if (!pt.down || e.pointerId !== pt.id) return;
  const dx = e.clientX - pt.x, dy = e.clientY - pt.y;
  if (Math.abs(e.clientX - pt.x) + Math.abs(e.clientY - pt.y) > 6) pt.dragged = true;
  if (pt.dragged) {
    cam.yaw -= dx * 0.0055;
    cam.pitch = Math.min(1.25, Math.max(0.08, cam.pitch + dy * 0.004));
    pt.x = e.clientX; pt.y = e.clientY;
  }
});
el.addEventListener('pointerup', e => {
  if (e.pointerId !== pt.id) return;
  pt.down = false;
  if (!pt.dragged) {
    const v = new THREE.Vector2(
      (e.clientX / window.innerWidth) * 2 - 1,
      -(e.clientY / window.innerHeight) * 2 + 1
    );
    raycaster.setFromCamera(v, camera);
    const hit = raycaster.intersectObject(ground)[0];
    if (hit) {
      const p = hit.point.clone(); p.y = 0;
      const rad = Math.hypot(p.x, p.z);
      if (rad > 25) { p.x *= 25 / rad; p.z *= 25 / rad; }
      state.target = p;
      const act = anim.state.action;
      if (act && act.name !== 'wave') anim.state.action = null;
    }
  }
});
el.addEventListener('wheel', e => {
  e.preventDefault();
  cam.dist = Math.min(11, Math.max(2.0, cam.dist + e.deltaY * 0.004));
}, { passive: false });

// pizzico per zoom su touch
let pinchDist = 0;
el.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (pinchDist) cam.dist = Math.min(11, Math.max(2.0, cam.dist - (d - pinchDist) * 0.015));
    pinchDist = d;
  }
}, { passive: true });
el.addEventListener('touchend', () => { pinchDist = 0; });

window.addEventListener('keydown', e => {
  if (document.activeElement === msgInput) return;
  state.interacted = true;
  state.keys[e.code] = true;
});
window.addEventListener('keyup', e => { state.keys[e.code] = false; });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Voce e fumetto ----------
const bubble = document.getElementById('bubble');
let bubbleTimer = null, fakeTalkTimer = null, watchdog = null;
let voice = null;

function pickVoice() {
  if (!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices();
  voice =
    vs.find(v => /it[-_]IT/i.test(v.lang) && /google/i.test(v.name)) ||
    vs.find(v => /it[-_]IT/i.test(v.lang)) ||
    vs.find(v => /^it/i.test(v.lang)) || null;
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function showBubble(text) {
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
}
function hideBubble(delay) {
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove('show'), delay || 250);
}
let speakSeq = 0;
function stopTalkVisuals() {
  anim.state.talking = false;
  hideBubble(350);
}
function fallbackTalk(text) {
  showBubble(text);
  anim.state.talking = true;
  clearTimeout(fakeTalkTimer);
  const dur = Math.min(8000, Math.max(1600, 900 + text.length * 62));
  fakeTalkTimer = setTimeout(stopTalkVisuals, dur);
}

function speak(text) {
  const id = ++speakSeq;
  anim.state.gestureLead = Math.random() < 0.5 ? -1 : 1;
  showBubble(text);
  clearTimeout(fakeTalkTimer);
  clearTimeout(watchdog);

  const canTTS = window.speechSynthesis && !state.muted && state.interacted;
  if (!canTTS) { fallbackTalk(text); return; }

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[👋💃🦘😂🎵❤️😄🌳]/g, ''));
  u.lang = 'it-IT';
  if (voice) u.voice = voice;
  u.rate = 1.04; u.pitch = 1.05;
  let started = false;
  u.onstart = () => { if (id !== speakSeq) return; started = true; clearTimeout(watchdog); anim.state.talking = true; };
  u.onboundary = () => { if (id === speakSeq) anim.state.mouthPulse = 1; };
  u.onend = () => { if (id === speakSeq) stopTalkVisuals(); };
  // se il TTS fallisce senza essere mai partito (es. nessuna voce), anima comunque
  u.onerror = () => {
    if (id !== speakSeq) return;
    if (!started) fallbackTalk(text); else stopTalkVisuals();
  };
  speechSynthesis.speak(u);
  watchdog = setTimeout(() => { if (id === speakSeq && !started) fallbackTalk(text); }, 800);
}

function updateBubblePosition() {
  if (!bubble.classList.contains('show')) return;
  const p = new THREE.Vector3(state.pos.x, 2.0 + (zeph.body.position.y - HIP_Y), state.pos.z);
  p.project(camera);
  if (p.z > 1) { bubble.style.opacity = '0'; return; }
  bubble.style.opacity = '';
  bubble.style.left = ((p.x * 0.5 + 0.5) * window.innerWidth) + 'px';
  bubble.style.top = ((-p.y * 0.5 + 0.5) * window.innerHeight - 8) + 'px';
}

// ---------- Risposte ----------
function botRespond(text) {
  const out = ZephCore.botReply(text);
  if (!out) return;

  if (out.stop) { state.wander = false; state.target = null; syncWanderChip(); }
  if (out.wander || out.follow) { state.wander = true; syncWanderChip(); }
  if (out.come) {
    const d = new THREE.Vector3(state.pos.x - camera.position.x, 0, state.pos.z - camera.position.z);
    const len = d.length() || 1;
    state.target = new THREE.Vector3(
      camera.position.x + (d.x / len) * 1.8, 0,
      camera.position.z + (d.z / len) * 1.8
    );
  }
  if (out.action) anim.startAction(out.action);
  speak(out.say);
}

// ---------- Interfaccia ----------
const msgInput = document.getElementById('msg');
const statusText = document.getElementById('statustext');
const wanderChip = document.getElementById('wanderchip');
const muteBtn = document.getElementById('mutebtn');

document.getElementById('send').addEventListener('click', sendMsg);
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
function sendMsg() {
  state.interacted = true;
  const t = msgInput.value;
  msgInput.value = '';
  botRespond(t);
}

document.querySelectorAll('.chip[data-cmd]').forEach(chip => {
  chip.addEventListener('click', () => {
    state.interacted = true;
    botRespond(chip.dataset.cmd);
  });
});
function syncWanderChip() { wanderChip.classList.toggle('on', state.wander); }
wanderChip.addEventListener('click', () => {
  state.interacted = true;
  state.wander = !state.wander;
  syncWanderChip();
  if (state.wander) speak('Vado a farmi una passeggiata! Chiamami se ti servo.');
  else { state.target = null; speak('Ok, resto qui con te!'); }
});
muteBtn.addEventListener('click', () => {
  state.muted = !state.muted;
  muteBtn.textContent = state.muted ? '🔇' : '🔊';
  if (state.muted && window.speechSynthesis) speechSynthesis.cancel();
});

let lastStatus = '';
function updateStatus() {
  const act = anim.state.action;
  let s;
  if (anim.state.talking) s = '💬 Sta parlando…';
  else if (act && act.name === 'dance') s = '💃 Sta ballando!';
  else if (act && act.name === 'jump') s = '🦘 Sta saltando!';
  else if (state.speed > 0.2) s = '🚶 Sta camminando…';
  else if (state.wander) s = '🌼 Si gode il panorama…';
  else s = '👂 Ti ascolta: scrivigli qualcosa!';
  if (s !== lastStatus) { lastStatus = s; statusText.textContent = s; }
}

// ---------- Loop principale ----------
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  updateMovement(dt);
  updateWander(t);
  anim.update(t, dt);
  updateCamera(dt);
  updateBubblePosition();
  updateStatus();

  for (const cl of clouds) {
    cl.position.x += dt * 0.35;
    if (cl.position.x > 42) cl.position.x = -42;
  }
  renderer.render(scene, camera);
}
tick();

// saluto iniziale (solo fumetto: la voce parte dopo la prima interazione)
setTimeout(() => {
  anim.startAction('wave');
  showBubble('Ciao! Sono Zeph 👋 Scrivimi qui sotto e ti rispondo a voce!');
  hideBubble(5200);
}, 700);

// piccolo gancio per debug/test
window.zeph = { state, anim, startAction: n => anim.startAction(n), speak, botRespond, cam };
})();
</script>
