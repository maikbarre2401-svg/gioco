<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MAIKBARRE</title>
<meta name="description" content="Profilo ufficiale di Maikbarre: TikTok, Instagram e Discord.">
<meta name="theme-color" content="#02040a">
<meta name="color-scheme" content="dark">
<link rel="icon" href="profile.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
@property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
}

:root {
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --violet: #7b5cff;
    --discord: #5865f2;
    --bg: #02040a;
    --text: #e8fbff;
    --muted: rgba(214, 240, 255, .72);
    --font-display: 'Orbitron', 'Arial Black', sans-serif;
    --font-body: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
    --font-mono: 'Share Tech Mono', ui-monospace, Consolas, monospace;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { margin: 0; height: 100%; }

body {
    background:
        radial-gradient(ellipse at 20% 10%, rgba(123, 92, 255, .18), transparent 55%),
        radial-gradient(ellipse at 85% 90%, rgba(255, 43, 214, .14), transparent 55%),
        radial-gradient(ellipse at 50% 45%, #0a1430 0%, #050816 50%, var(--bg) 100%);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}

/* ---------- Sfondo: video + scena 3D + effetti ---------- */
#video-background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: .4;
}
#video-background.is-hidden { display: none; }

#bg3d {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: block;
}

.fx { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.fx-vignette { background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, .78) 100%); }
.fx-scan {
    background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
}
.fx-beam {
    position: fixed;
    left: 0;
    right: 0;
    top: -30vh;
    height: 30vh;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, .055), transparent);
    animation: beam 7s linear infinite;
}
@keyframes beam { to { transform: translateY(160vh); } }

#flash {
    position: fixed;
    inset: 0;
    z-index: 60;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at center, #fff 0%, rgba(0, 240, 255, .85) 25%, rgba(123, 92, 255, .4) 50%, transparent 75%);
}
#flash.go { animation: flash 1s ease-out; }
@keyframes flash {
    0% { opacity: 0; transform: scale(.2); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: scale(2.4); }
}

/* ---------- Schermata iniziale (boot) ---------- */
#intro-screen {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: radial-gradient(ellipse at center, rgba(2, 6, 18, .55), rgba(0, 0, 0, .92) 75%);
    cursor: pointer;
    outline: none;
    transition: opacity .9s ease, transform 1.1s cubic-bezier(.7, 0, .2, 1), filter .9s ease;
}
#intro-screen.leaving {
    opacity: 0;
    transform: scale(1.4);
    filter: blur(10px);
    pointer-events: none;
}

.boot {
    width: min(540px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
}

.boot-brand {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(26px, 7vw, 40px);
    letter-spacing: .3em;
    padding-left: .3em;
    color: #fff;
    text-shadow: 0 0 12px rgba(0, 240, 255, .9), 0 0 40px rgba(0, 240, 255, .45);
}

.boot-log {
    width: 100%;
    min-height: 8.6em;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.65;
    color: rgba(0, 240, 255, .85);
    text-shadow: 0 0 8px rgba(0, 240, 255, .45);
}
.boot-line { display: flex; gap: 8px; white-space: nowrap; overflow: hidden; }
.boot-line .ok { margin-left: auto; color: #5dff9b; text-shadow: 0 0 8px rgba(93, 255, 155, .6); }

.enter {
    position: relative;
    width: 210px;
    height: 210px;
    display: grid;
    place-items: center;
}
.enter-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(0, 240, 255, .25);
}
.enter-ring.r1 {
    border-width: 2px;
    border-top-color: var(--cyan);
    border-bottom-color: var(--magenta);
    filter: drop-shadow(0 0 6px var(--cyan));
    animation: spin 3s linear infinite;
}
.enter-ring.r2 { inset: 18px; border-style: dashed; animation: spin 12s linear infinite reverse; }
.enter-ring.r3 {
    inset: 36px;
    border-left-color: var(--magenta);
    border-right-color: var(--cyan);
    box-shadow: inset 0 0 40px rgba(0, 240, 255, .2), 0 0 40px rgba(123, 92, 255, .25);
    animation: spin 5s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.enter-label {
    position: relative;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 14px;
    line-height: 1.5;
    letter-spacing: .2em;
    padding-left: .2em;
    text-align: center;
    white-space: pre-line;
    color: #fff;
    text-shadow: 0 0 10px var(--cyan);
    animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe { 50% { opacity: .55; } }
#intro-screen.ready .enter-label { animation-duration: 1.2s; }

.boot-bar {
    width: 100%;
    height: 2px;
    background: rgba(255, 255, 255, .08);
    overflow: hidden;
    border-radius: 2px;
}
.boot-bar span {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--cyan), var(--violet), var(--magenta));
    box-shadow: 0 0 12px var(--cyan);
    transition: width .3s var(--ease-out);
}

.enter-hint {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .35em;
    color: var(--muted);
}

/* ---------- Effetto glitch ---------- */
.glitch { position: relative; }
.glitch::before,
.glitch::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    padding: inherit;
    pointer-events: none;
    opacity: 0;
    text-shadow: none;
}
.glitch::before { color: var(--cyan); }
.glitch::after { color: var(--magenta); }
.glitch.glitching::before { opacity: .9; animation: glitch-a .42s steps(1) both; }
.glitch.glitching::after { opacity: .9; animation: glitch-b .42s steps(1) both; }

@keyframes glitch-a {
    0%   { clip-path: inset(8% 0 62% 0);  transform: translate(-7px, -1px); }
    20%  { clip-path: inset(55% 0 20% 0); transform: translate(6px, 1px); }
    40%  { clip-path: inset(30% 0 45% 0); transform: translate(-4px, 0); }
    60%  { clip-path: inset(75% 0 4% 0);  transform: translate(5px, -1px); }
    80%  { clip-path: inset(14% 0 70% 0); transform: translate(-3px, 1px); }
    100% { clip-path: inset(50% 0 50% 0); transform: none; }
}
@keyframes glitch-b {
    0%   { clip-path: inset(65% 0 10% 0); transform: translate(7px, 1px); }
    20%  { clip-path: inset(12% 0 66% 0); transform: translate(-6px, -1px); }
    40%  { clip-path: inset(42% 0 33% 0); transform: translate(4px, 1px); }
    60%  { clip-path: inset(3% 0 80% 0);  transform: translate(-5px, 0); }
    80%  { clip-path: inset(70% 0 12% 0); transform: translate(3px, -1px); }
    100% { clip-path: inset(50% 0 50% 0); transform: none; }
}

/* ---------- Contenuto principale ---------- */
#main-content {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 40px 16px;
    visibility: hidden;
    outline: none;
}
#main-content.visible { visibility: visible; }

.scene {
    margin: auto;
    width: 100%;
    max-width: 470px;
    perspective: 1100px;
}

.card-wrap { transform-style: preserve-3d; }
.visible .card-wrap { animation: card-in 1.5s var(--ease-out) .25s backwards; }
@keyframes card-in {
    from { transform: translateZ(-2200px) rotateX(55deg) rotateY(-30deg) rotateZ(-6deg); }
    to   { transform: none; }
}

.card {
    --bass: 0;
    --mx: 50%;
    --my: 30%;
    --hx: 50%;
    --hy: 50%;
    position: relative;
    transform-style: preserve-3d;
    border-radius: 26px;
    padding: 26px 26px 20px;
    will-change: transform;
}

.card-glow {
    position: absolute;
    inset: -4px;
    border-radius: 30px;
    background: conic-gradient(from var(--angle), var(--cyan), var(--violet), var(--magenta), var(--violet), var(--cyan));
    filter: blur(28px);
    opacity: calc(.4 + var(--bass) * .5);
    transform: translateZ(-50px);
    animation: angle 6s linear infinite;
    pointer-events: none;
}

.card-glass {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    overflow: hidden;
    background: linear-gradient(160deg, rgba(12, 24, 52, .62), rgba(4, 8, 22, .72));
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    backdrop-filter: blur(16px) saturate(150%);
    box-shadow: 0 40px 90px -20px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .1);
}
.card-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(0, 240, 255, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, .07) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 15%, transparent 70%);
    mask-image: radial-gradient(ellipse at 50% 0%, #000 15%, transparent 70%);
}
.card-holo {
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 25%, rgba(0, 240, 255, .14) 38%, rgba(255, 43, 214, .14) 50%, rgba(123, 92, 255, .14) 62%, transparent 75%);
    background-size: 260% 260%;
    background-position: var(--hx) var(--hy);
    mix-blend-mode: color-dodge;
}
.card-glare {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--mx) var(--my), rgba(255, 255, 255, .17), transparent 42%);
}

.card-border {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: conic-gradient(from var(--angle), var(--cyan), var(--violet) 25%, var(--magenta) 50%, var(--violet) 75%, var(--cyan));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    transform: translateZ(1px);
    animation: angle 6s linear infinite;
    pointer-events: none;
}
@keyframes angle { to { --angle: 360deg; } }

.corner {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 2px solid var(--cyan);
    transform: translateZ(28px);
    filter: drop-shadow(0 0 5px var(--cyan));
    pointer-events: none;
}
.corner.tl { top: 12px; left: 12px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
.corner.tr { top: 12px; right: 12px; border-left: 0; border-bottom: 0; border-top-right-radius: 8px; border-color: var(--magenta); filter: drop-shadow(0 0 5px var(--magenta)); }
.corner.bl { bottom: 12px; left: 12px; border-right: 0; border-top: 0; border-bottom-left-radius: 8px; border-color: var(--magenta); filter: drop-shadow(0 0 5px var(--magenta)); }
.corner.br { bottom: 12px; right: 12px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }

/* Ogni strato galleggia a una profondità diversa (--z) */
.layer { position: relative; transform: translateZ(var(--z, 0px)); }

.visible .reveal { animation: reveal 1s var(--ease-out) var(--d, 1s) backwards; }
@keyframes reveal { from { opacity: 0; translate: 0 26px; } }

/* HUD */
.hud {
    --z: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 0 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .14em;
    color: var(--muted);
}
.status { display: inline-flex; align-items: center; gap: 7px; color: #5dff9b; }
.status i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #5dff9b;
    box-shadow: 0 0 10px #5dff9b;
    animation: breathe 1.6s ease-in-out infinite;
}

/* Avatar */
.avatar-wrap {
    --z: 75px;
    width: 150px;
    height: 150px;
    margin: 26px auto 22px;
    transform-style: preserve-3d;
}
.avatar-halo {
    position: absolute;
    inset: -26px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 240, 255, .55), rgba(123, 92, 255, .25) 45%, transparent 68%);
    scale: calc(1 + var(--bass) * .35);
    opacity: calc(.55 + var(--bass) * .45);
    transform: translateZ(-20px);
    pointer-events: none;
}
.avatar-frame {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from var(--angle), var(--cyan), var(--magenta), var(--violet), var(--cyan));
    box-shadow: 0 0 28px rgba(0, 240, 255, .55), 0 0 60px rgba(255, 43, 214, .25);
    animation: angle 3.5s linear infinite;
}
.avatar {
    --pic: url('profile.jpg');
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #050a18;
}
.avatar img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 35%;
}
.avatar-initial {
    display: none;
    position: absolute;
    inset: 0;
    place-items: center;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 64px;
    color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan);
}
.avatar.no-pic img { display: none; }
.avatar.no-pic .avatar-initial { display: grid; }
.avatar::before,
.avatar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--pic) center 35% / cover;
    opacity: 0;
    pointer-events: none;
}
.avatar::after {
    background: linear-gradient(rgba(255, 43, 214, .55), rgba(255, 43, 214, .55)), var(--pic) center 35% / cover;
    background-blend-mode: multiply;
    mix-blend-mode: screen;
}
.avatar.no-pic::before, .avatar.no-pic::after { display: none; }
.avatar.glitching::before { opacity: 1; animation: glitch-a .42s steps(1) both; }
.avatar.glitching::after { opacity: .9; animation: glitch-b .42s steps(1) both; }

.orbit {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    border: 1px solid rgba(0, 240, 255, .5);
    pointer-events: none;
}
.orbit::after {
    content: '';
    position: absolute;
    top: -4px;
    left: calc(50% - 4px);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px #fff, 0 0 14px var(--cyan), 0 0 24px var(--cyan);
}
.orbit.o1 { animation: orbit-1 5s linear infinite; }
.orbit.o2 { inset: -32px; border-color: rgba(255, 43, 214, .45); animation: orbit-2 7s linear infinite; }
.orbit.o2::after { box-shadow: 0 0 6px #fff, 0 0 14px var(--magenta), 0 0 24px var(--magenta); }
.orbit.o3 { inset: -12px; border-color: rgba(123, 92, 255, .5); animation: orbit-3 9s linear infinite reverse; }
.orbit.o3::after { box-shadow: 0 0 6px #fff, 0 0 14px var(--violet), 0 0 24px var(--violet); }
@keyframes orbit-1 {
    from { transform: rotateX(74deg) rotateZ(0deg); }
    to   { transform: rotateX(74deg) rotateZ(360deg); }
}
@keyframes orbit-2 {
    from { transform: rotateY(58deg) rotateX(72deg) rotateZ(0deg); }
    to   { transform: rotateY(58deg) rotateX(72deg) rotateZ(360deg); }
}
@keyframes orbit-3 {
    from { transform: rotateY(-58deg) rotateX(72deg) rotateZ(0deg); }
    to   { transform: rotateY(-58deg) rotateX(72deg) rotateZ(360deg); }
}

/* Nome */
.name {
    --z: 58px;
    margin: 0;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(30px, 9vw, 44px);
    line-height: 1.15;
    letter-spacing: .12em;
    padding-left: .12em;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 10px rgba(0, 240, 255, .85), 0 0 30px rgba(0, 240, 255, .45), 0 0 60px rgba(255, 43, 214, .35);
}

.typed {
    --z: 42px;
    min-height: 1.5em;
    margin-top: 8px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 15px;
    letter-spacing: .08em;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(0, 240, 255, .6);
}
.typed .prompt { color: var(--magenta); }
.caret { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.info {
    --z: 30px;
    margin: 12px 0 20px;
    text-align: center;
    font-size: 17px;
    font-weight: 500;
    color: var(--muted);
}

/* Bottoni 3D */
.links {
    --z: 46px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    transform-style: preserve-3d;
}

.btn3d {
    --brand: var(--cyan);
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 13px;
    border-radius: 14px;
    border: 1px solid rgba(0, 240, 255, .28);
    background: rgba(255, 255, 255, .045);
    color: var(--text);
    text-decoration: none;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: .1em;
    overflow: hidden;
    cursor: pointer;
    transform: translateZ(0);
    transition: transform .4s var(--ease-out), translate .25s ease-out, border-color .3s, box-shadow .3s, background .3s;
}
.btn3d::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: -60%;
    width: 50%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .28), transparent);
    transform: skewX(-20deg);
    transition: transform .8s var(--ease-out);
    pointer-events: none;
}
.btn3d:hover,
.btn3d:focus-visible {
    transform: translateZ(28px) scale(1.03);
    border-color: var(--brand);
    background: color-mix(in srgb, var(--brand) 16%, transparent);
    box-shadow: 0 14px 34px -12px var(--brand), 0 0 22px -6px var(--brand), inset 0 0 0 1px var(--brand);
    outline: none;
}
.btn3d:hover::before,
.btn3d:focus-visible::before { transform: skewX(-20deg) translateX(440%); }
.btn3d:active { transform: translateZ(10px) scale(.98); }

.btn-icon {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    color: #fff;
}
.btn-icon svg { width: 20px; height: 20px; }
.btn-label { display: flex; flex-direction: column; gap: 2px; line-height: 1.15; min-width: 0; }
.btn-label small {
    font-family: var(--font-mono);
    font-weight: 400;
    font-size: 11px;
    letter-spacing: .02em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.btn-arrow {
    flex: none;
    width: 16px;
    height: 16px;
    margin-left: auto;
    opacity: .55;
    transition: transform .3s, opacity .3s;
}
.btn3d:hover .btn-arrow { transform: translate(2px, -2px); opacity: 1; }

.ig { --brand: #ff3d9a; }
.ig .btn-icon { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
.tt { --brand: #25f4ee; }
.tt .btn-icon { background: #000; border: 1px solid rgba(255, 255, 255, .15); }
.tt .btn-icon svg { filter: drop-shadow(-1.5px -1px 0 #25f4ee) drop-shadow(1.5px 1px 0 #fe2c55); }

/* Discord */
.discord {
    --z: 36px;
    margin-top: 14px;
    padding: 16px;
    border-radius: 18px;
    border: 1px solid rgba(88, 101, 242, .55);
    background: linear-gradient(135deg, rgba(88, 101, 242, .24), rgba(0, 240, 255, .05));
    box-shadow: inset 0 0 30px -12px rgba(88, 101, 242, .9);
    transform-style: preserve-3d;
}
.discord-head {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .16em;
}
.discord-head svg { width: 26px; height: 26px; color: #8e99ff; filter: drop-shadow(0 0 8px var(--discord)); }
.discord-row { display: flex; gap: 10px; margin-top: 12px; transform-style: preserve-3d; }
.discord-user {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;

<script>
(() => {
    'use strict';

    const $ = (sel, el = document) => el.querySelector(sel);
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const FINE_POINTER = matchMedia('(hover: hover) and (pointer: fine)').matches;

    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    // Il browser blocca l'analisi audio sui file aperti in locale (file://): lì il ritmo viene simulato.
    const CAN_ANALYSE = /^https?:$/.test(location.protocol);

    const body = document.body;
    const intro = $('#intro-screen');
    const main = $('#main-content');
    const card = $('#card');
    const audio = $('#background-audio');
    const video = $('#video-background');
    const playBtn = $('#play-btn');
    const trackTitle = $('#track-title');
    const volume = $('#volume');

    const state = {
        entered: false,
        playing: false,
        audioFailed: false,
        mouseX: 0,
        mouseY: 0,
        bass: 0,
        impulse: 0,
    };
    const pointer = { x: innerWidth / 2, y: innerHeight / 2 };

    $('#year').textContent = new Date().getFullYear();

    /* ================= Media: fallback se i file mancano ================= */
    function hideVideo() { video.classList.add('is-hidden'); }
    function markAudioFailed() {
        state.audioFailed = true;
        setPlaying(false);
        playBtn.disabled = true;
        trackTitle.textContent = 'AUDIO NON TROVATO';
    }
    video.addEventListener('error', hideVideo);
    audio.addEventListener('error', markAudioFailed);
    if (video.error || video.networkState === 3) hideVideo();
    if (audio.error || audio.networkState === 3) markAudioFailed();

    const avatar = $('#avatar');
    const pic = $('#profile-pic');
    pic.addEventListener('error', () => avatar.classList.add('no-pic'));
    if (pic.complete && pic.naturalWidth === 0) avatar.classList.add('no-pic');

    /* ================= Audio + analisi frequenze ================= */
    let actx = null, analyser = null, gainNode = null, freq = null;

    function setupAudioGraph() {
        if (!CAN_ANALYSE || actx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try {
            actx = new AC();
            const src = actx.createMediaElementSource(audio);
            analyser = actx.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.78;
            gainNode = actx.createGain();
            src.connect(analyser);
            analyser.connect(gainNode);
            gainNode.connect(actx.destination);
            freq = new Uint8Array(analyser.frequencyBinCount);
            audio.volume = 1;
        } catch (err) {
            analyser = null;
            gainNode = null;
        }
    }

    function setPlaying(on) {
        state.playing = on;
        body.classList.toggle('is-playing', on);
        playBtn.setAttribute('aria-label', on ? 'Metti in pausa la musica' : 'Riproduci la musica');
        if (!state.audioFailed) trackTitle.textContent = on ? 'NOW PLAYING' : 'IN PAUSA';
    }

    function playAudio() {
        if (state.audioFailed) return;
        if (actx && actx.state === 'suspended') actx.resume();
        const p = audio.play();
        if (p && p.catch) p.catch(() => setPlaying(false));
    }

    audio.addEventListener('play', () => setPlaying(true));
    audio.addEventListener('pause', () => setPlaying(false));
    playBtn.addEventListener('click', () => (audio.paused ? playAudio() : audio.pause()));

    let lastVolume = parseFloat(volume.value) || 0.7;
    function applyVolume(v) {
        if (gainNode) gainNode.gain.value = v;
        else audio.volume = v;
        volume.value = v;
        volume.style.setProperty('--val', (v * 100).toFixed(0) + '%');
        body.classList.toggle('is-muted', v === 0);
    }
    volume.addEventListener('input', () => {
        const v = parseFloat(volume.value);
        if (v > 0) lastVolume = v;
        applyVolume(v);
    });
    $('#mute-btn').addEventListener('click', () => {
        applyVolume(parseFloat(volume.value) > 0 ? 0 : lastVolume || 0.7);
    });
    applyVolume(lastVolume);

    function sampleAudio(t) {
        let bass = 0;
        if (state.playing) {
            if (analyser) {
                analyser.getByteFrequencyData(freq);
                let s = 0;
                for (let i = 1; i <= 6; i++) s += freq[i];
                bass = Math.min(1, Math.pow(s / (6 * 255), 2.2) * 1.15);
            } else {
                const phase = (t * 2) % 1;
                bass = 0.12 + 0.55 * Math.exp(-phase * 7);

    /* ================= Scena 3D (Three.js) ================= */
    const NOISE_GLSL = `
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(
                        i.z + vec4(0.0, i1.z, i2.z, 1.0))
                      + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                      + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0) * 2.0 + 1.0;
            vec4 s1 = floor(b1) * 2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
            vec3 p0 = vec3(a0.xy, h.x);
            vec3 p1 = vec3(a0.zw, h.y);
            vec3 p2 = vec3(a1.xy, h.z);
            vec3 p3 = vec3(a1.zw, h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
            m = m * m;
            return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
        }
    `;

    function initScene() {
        const T = window.THREE;
        if (!T) return null;
        let renderer;
        try {
            renderer = new T.WebGLRenderer({
                canvas: $('#bg3d'),
                antialias: !LOW_POWER,
                alpha: true,
                powerPreference: 'high-performance',
            });
        } catch (err) {
            return null;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, LOW_POWER ? 1.5 : 2));
        renderer.setClearColor(0x000000, 0);

        const scene = new T.Scene();
        scene.fog = new T.FogExp2(0x02040a, 0.012);
        const camera = new T.PerspectiveCamera(60, 1, 0.1, 500);
        const baseCamZ = () => {
            const a = innerWidth / innerHeight;
            return a < 0.75 ? 14 : a < 1.1 ? 12 : 10;
        };
        let camZ = REDUCED ? baseCamZ() : 36;
        let camZTarget = camZ;
        camera.position.set(0, 0.8, camZ);

        const ADD = T.AdditiveBlending;
        const COL = {
            cyan: new T.Color(0x00f0ff),
            magenta: new T.Color(0xff2bd6),
            violet: new T.Color(0x7b5cff),
            white: new T.Color(0xdffcff),
        };

        const sprite = (() => {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const g = c.getContext('2d');
            const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
            grd.addColorStop(0, 'rgba(255,255,255,1)');
            grd.addColorStop(0.2, 'rgba(255,255,255,.85)');
            grd.addColorStop(0.5, 'rgba(255,255,255,.22)');
            grd.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = grd;
            g.fillRect(0, 0, 64, 64);
            return new T.CanvasTexture(c);
        })();

        /* --- Campo stellare a tunnel (effetto warp) --- */
        const STARS = LOW_POWER ? 1400 : 3000;
        const sPos = new Float32Array(STARS * 3);
        const sCol = new Float32Array(STARS * 3);
        const resetStar = (i, z) => {
            const r = 4 + Math.random() * 60;
            const a = Math.random() * Math.PI * 2;
            sPos[i * 3] = Math.cos(a) * r;
            sPos[i * 3 + 1] = Math.sin(a) * r * 0.75;
            sPos[i * 3 + 2] = z;
        };
        for (let i = 0; i < STARS; i++) {
            resetStar(i, -210 + Math.random() * 220);
            const roll = Math.random();
            const c = roll < 0.55 ? COL.white : roll < 0.8 ? COL.cyan : roll < 0.92 ? COL.magenta : COL.violet;
            sCol.set([c.r, c.g, c.b], i * 3);
        }
        const starGeo = new T.BufferGeometry();
        starGeo.setAttribute('position', new T.BufferAttribute(sPos, 3));
        starGeo.setAttribute('color', new T.BufferAttribute(sCol, 3));
        const starMat = new T.PointsMaterial({
            size: 0.35, map: sprite, vertexColors: true, transparent: true,
            depthWrite: false, blending: ADD,
        });
        const stars = new T.Points(starGeo, starMat);
        scene.add(stars);

        /* --- Nucleo energetico: sfera deformata dal rumore e dai bassi --- */
        const blobMat = new T.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uBass: { value: 0 },
                uColorA: { value: COL.cyan },
                uColorB: { value: COL.magenta },
                uColorC: { value: COL.violet },
            },
            vertexShader: `
                uniform float uTime;
                uniform float uBass;
                varying vec3 vNormal;
                varying vec3 vView;
                varying float vNoise;
                ${NOISE_GLSL}
                void main() {
                    float n = snoise(normal * 1.4 + vec3(0.0, uTime * 0.25, uTime * 0.18));
                    float n2 = snoise(normal * 3.2 - vec3(uTime * 0.4));
                    vec3 p = position + normal * (n * (0.22 + uBass * 0.6) + n2 * 0.07);
                    vNoise = n;
                    vec4 mv = modelViewMatrix * vec4(p, 1.0);
                    vNormal = normalize(normalMatrix * normal);
                    vView = normalize(-mv.xyz);
                    gl_Position = projectionMatrix * mv;
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform float uBass;
                uniform vec3 uColorA;
                uniform vec3 uColorB;
                uniform vec3 uColorC;
                varying vec3 vNormal;
                varying vec3 vView;
                varying float vNoise;
                void main() {
                    float fres = pow(1.0 - abs(dot(normalize(vNormal), normalize(vView))), 2.0);
                    vec3 col = mix(uColorA, uColorB, smoothstep(-0.5, 0.7, vNoise));
                    col = mix(col, uColorC, smoothstep(0.4, 1.0, fres) * 0.5);
                    float bands = 0.5 + 0.5 * sin(vNoise * 18.0 - uTime * 2.0);
                    float a = 0.06 + fres * (0.9 + uBass * 0.7) + smoothstep(0.92, 1.0, bands) * 0.22;
                    gl_FragColor = vec4(col, a);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: ADD,
        });
        const blob = new T.Mesh(new T.IcosahedronGeometry(2.9, LOW_POWER ? 18 : 32), blobMat);
        scene.add(blob);

        /* --- Gusci wireframe con nodi luminosi --- */
        const uniquePoints = (geo) => {
            const p = geo.attributes.position.array;
            const seen = new Set();
            const out = [];
            for (let i = 0; i < p.length; i += 3) {
                const k = p[i].toFixed(3) + ',' + p[i + 1].toFixed(3) + ',' + p[i + 2].toFixed(3);
                if (!seen.has(k)) {
                    seen.add(k);
                    out.push(p[i], p[i + 1], p[i + 2]);
                }
            }
            const g = new T.BufferGeometry();
            g.setAttribute('position', new T.Float32BufferAttribute(out, 3));
            return g;
        };
        const lineMat = (color, opacity) => new T.LineBasicMaterial({
            color, transparent: true, opacity, blending: ADD, depthWrite: false,
        });

        const shellGeo = new T.IcosahedronGeometry(4.6, 1);
        const shell = new T.Group();
        shell.add(new T.LineSegments(new T.EdgesGeometry(shellGeo), lineMat(0x00f0ff, 0.3)));
        shell.add(new T.Points(uniquePoints(shellGeo), new T.PointsMaterial({
            color: 0xaffcff, size: 0.32, map: sprite, transparent: true, depthWrite: false, blending: ADD,
        })));
        scene.add(shell);

        const outer = new T.LineSegments(new T.EdgesGeometry(new T.IcosahedronGeometry(6.4, 0)), lineMat(0xff2bd6, 0.18));
        scene.add(outer);

        /* --- Anello galattico inclinato + orbite al neon --- */
        const RING = LOW_POWER ? 900 : 2200;
        const rPos = new Float32Array(RING * 3);
        const rCol = new Float32Array(RING * 3);
        for (let i = 0; i < RING; i++) {
            const rr = 7 + Math.pow(Math.random(), 1.7) * 8;
            const a = Math.random() * Math.PI * 2;
            rPos.set([Math.cos(a) * rr, (Math.random() - 0.5) * 0.5, Math.sin(a) * rr], i * 3);
            const c = COL.cyan.clone().lerp(COL.magenta, (rr - 7) / 8);
            rCol.set([c.r, c.g, c.b], i * 3);
        }
        const ringGeo = new T.BufferGeometry();
        ringGeo.setAttribute('position', new T.BufferAttribute(rPos, 3));
        ringGeo.setAttribute('color', new T.BufferAttribute(rCol, 3));
        const ring = new T.Points(ringGeo, new T.PointsMaterial({
            size: 0.13, map: sprite, vertexColors: true, transparent: true, depthWrite: false, blending: ADD,
        }));
        const ringGroup = new T.Group();
        ringGroup.rotation.set(1.18, 0, 0.32);
        ringGroup.add(ring);
        const halo1 = new T.Mesh(new T.TorusGeometry(5.6, 0.014, 6, 200), new T.MeshBasicMaterial({
            color: 0x00f0ff, transparent: true, opacity: 0.7, blending: ADD, depthWrite: false,
        }));
        const halo2 = new T.Mesh(new T.TorusGeometry(6.9, 0.01, 6, 220), new T.MeshBasicMaterial({
            color: 0xff2bd6, transparent: true, opacity: 0.5, blending: ADD, depthWrite: false,
        }));
        halo1.rotation.x = Math.PI / 2;
        halo2.rotation.x = Math.PI / 2 + 0.25;
        ringGroup.add(halo1, halo2);
        scene.add(ringGroup);

        /* --- Forme fluttuanti --- */
        const shapeGeos = [
            new T.OctahedronGeometry(0.8),
            new T.TetrahedronGeometry(0.9),
            new T.TorusGeometry(0.65, 0.2, 8, 20),
            new T.IcosahedronGeometry(0.75, 0),
            new T.BoxGeometry(1, 1, 1),
            new T.TorusKnotGeometry(0.5, 0.15, 48, 6),
        ];
        const shapes = [];
        for (let i = 0; i < 12; i++) {
            const m = new T.LineSegments(
                new T.EdgesGeometry(shapeGeos[i % shapeGeos.length]),
                lineMat(i % 2 ? 0xff2bd6 : 0x00f0ff, 0.6)
            );
            const side = i % 2 ? 1 : -1;
            m.position.set(side * (8 + Math.random() * 9), (Math.random() - 0.5) * 13, -3 - Math.random() * 16);
            m.userData = {
                rx: (Math.random() - 0.5) * 0.9,
                ry: (Math.random() - 0.5) * 0.9,
                baseY: m.position.y,
                phase: Math.random() * Math.PI * 2,
            };
            shapes.push(m);
            scene.add(m);
        }

        /* --- Pavimento a griglia synthwave --- */
        const grid = new T.GridHelper(260, 130, 0xff2bd6, 0x00f0ff);
        grid.position.y = -7.5;
        grid.material.transparent = true;
        grid.material.opacity = 0.3;
        grid.material.depthWrite = false;
        grid.material.blending = ADD;
        scene.add(grid);
        let gridTravel = 0;

        let warpStart = -1;

        function resize() {
            renderer.setSize(innerWidth, innerHeight, false);
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            if (state.entered || REDUCED) camZTarget = baseCamZ();
        }

        function warp(now) {
            camZTarget = baseCamZ();
            if (!REDUCED) warpStart = now;
        }

        function update(dt, t) {
            let warpAmt = 0;
            if (warpStart >= 0) {
                const w = t - warpStart;
                warpAmt = w < 0.45 ? Math.pow(w / 0.45, 3) : Math.pow(Math.max(0, 1 - (w - 0.45) / 1.8), 2);
                if (w > 2.4) warpStart = -1;
            }
            const energy = Math.min(1.5, state.bass + state.impulse);
            const speed = (state.entered ? 2.5 : 1.2) + energy * 10 + warpAmt * 190;

            const limit = camera.position.z + 1;
            for (let i = 0; i < STARS; i++) {
                const k = i * 3 + 2;
                sPos[k] += speed * dt;
                if (sPos[k] > limit) resetStar(i, -210 - Math.random() * 15);
            }
            starGeo.attributes.position.needsUpdate = true;
            starMat.size = 0.32 + warpAmt * 0.55 + energy * 0.12;
            stars.rotation.z += dt * (0.02 + warpAmt * 0.6);

            const ease = (rate) => 1 - Math.exp(-dt * rate);
            camZ += (camZTarget - camZ) * ease(warpStart >= 0 ? 2.4 : 1.6);
            camera.position.z = camZ;
            camera.position.x += (state.mouseX * 1.8 - camera.position.x) * ease(2.5);
            camera.position.y += ((0.8 - state.mouseY * 1.2) - camera.position.y) * ease(2.5);
            camera.fov = 60 + warpAmt * 32;
            camera.updateProjectionMatrix();
            camera.lookAt(0, 0, 0);

            blobMat.uniforms.uTime.value = t;
            blobMat.uniforms.uBass.value = energy;
            blob.rotation.y += dt * (0.12 + energy * 0.4);
            blob.rotation.x += dt * 0.05;
            blob.scale.setScalar(1 + energy * 0.1);

            shell.rotation.y -= dt * (0.08 + energy * 0.3);
            shell.rotation.x += dt * 0.03;
            shell.scale.setScalar(1 + energy * 0.07);
            outer.rotation.y += dt * 0.05;
            outer.rotation.z += dt * 0.03;

            ring.rotation.y += dt * (0.05 + energy * 0.2);
            halo1.rotation.z += dt * 0.2;
            halo2.rotation.z -= dt * 0.15;

            for (const m of shapes) {
                m.rotation.x += m.userData.rx * dt;
                m.rotation.y += m.userData.ry * dt;
                m.position.y = m.userData.baseY + Math.sin(t * 0.6 + m.userData.phase) * 0.6;
            }

            gridTravel += speed * dt * 0.35;
            grid.position.z = gridTravel % 2;
            grid.material.opacity = 0.22 + energy * 0.25;

            renderer.render(scene, camera);
        }

        resize();
        return { update, resize, warp };
    }

    let scene3d = null;
    try { scene3d = initScene(); } catch (err) { scene3d = null; }

    /* ================= Visualizzatore audio nel player ================= */
    const viz = $('#viz');
    const vctx = viz.getContext('2d');
    const BARS = 30;
    const barVals = new Float32Array(BARS);
    let vizGrad = null;

    function sizeViz() {
        viz.width = Math.max(1, Math.round(viz.clientWidth * DPR));
        viz.height = Math.max(1, Math.round(viz.clientHeight * DPR));
        vizGrad = vctx.createLinearGradient(0, 0, viz.width, 0);
        vizGrad.addColorStop(0, '#00f0ff');
        vizGrad.addColorStop(0.5, '#7b5cff');
        vizGrad.addColorStop(1, '#ff2bd6');
    }

    function drawViz(t) {
        const w = viz.width, h = viz.height;
        if (w < 2) return;
        vctx.clearRect(0, 0, w, h);
        for (let i = 0; i < BARS; i++) {
            let v;
            if (state.playing && analyser) {
                const lo = 1 + Math.floor(Math.pow(i / BARS, 1.6) * 140);
                const hi = 2 + Math.floor(Math.pow((i + 1) / BARS, 1.6) * 140);
                let s = 0;
                for (let k = lo; k < hi; k++) s += freq[k];
                v = s / (hi - lo) / 255;
            } else if (state.playing) {
                v = (0.2 + 0.4 * Math.abs(Math.sin(t * 3.1 + i * 0.55))) * (0.5 + state.bass) * (1 - (i / BARS) * 0.45);
            } else {
                v = 0.07 + 0.04 * Math.sin(t * 2 + i * 0.5);
            }
            barVals[i] += (v - barVals[i]) * 0.35;
            const bw = w / BARS;
            const bh = Math.max(2 * DPR, Math.min(1, barVals[i]) * h);
            vctx.fillStyle = vizGrad;
            vctx.fillRect(i * bw + bw * 0.18, h - bh, bw * 0.64, bh);
        }
    }

    /* ================= Input: mouse, giroscopio, cursore ================= */
    function onPointerMove(e) {
        if (e.pointerType === 'touch') return;
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        state.mouseX = (e.clientX / innerWidth) * 2 - 1;
        state.mouseY = (e.clientY / innerHeight) * 2 - 1;
        body.classList.add('pointer-seen');
        if (state.entered) {
            const r = card.getBoundingClientRect();
            card.style.setProperty('--mx', (((e.clientX - r.left) / r.width) * 100).toFixed(1) + '%');
            card.style.setProperty('--my', (((e.clientY - r.top) / r.height) * 100).toFixed(1) + '%');
        }
    }
    addEventListener('pointermove', onPointerMove, { passive: true });
    document.documentElement.addEventListener('mouseleave', () => body.classList.remove('pointer-seen'));

    function onOrientation(e) {
        if (e.gamma == null || e.beta == null) return;
        state.mouseX = clamp(e.gamma / 30, -1, 1);
        state.mouseY = clamp((e.beta - 45) / 30, -1, 1);
        card.style.setProperty('--mx', (50 + state.mouseX * 45).toFixed(1) + '%');
        card.style.setProperty('--my', (40 + state.mouseY * 40).toFixed(1) + '%');
    }
    function requestGyro() {
        if (FINE_POINTER || REDUCED || !window.DeviceOrientationEvent) return;
        const DOE = window.DeviceOrientationEvent;
        if (typeof DOE.requestPermission === 'function') {
            DOE.requestPermission()
                .then((res) => { if (res === 'granted') addEventListener('deviceorientation', onOrientation); })
                .catch(() => {});
        } else {
            addEventListener('deviceorientation', onOrientation);
        }
    }

    const cursor = $('#cursor');
    const cursorDot = $('#cursor-dot');
    const cursorPos = { x: pointer.x, y: pointer.y };
    if (FINE_POINTER) body.classList.add('has-cursor');
    document.addEventListener('pointerover', (e) => {
        cursor.classList.toggle('hover', !!e.target.closest('a, button, input, [role="button"]'));
    });
    addEventListener('pointerdown', () => cursor.classList.add('down'));
    addEventListener('pointerup', () => cursor.classList.remove('down'));

    function updateCursor() {
        if (!FINE_POINTER) return;
        cursorPos.x += (pointer.x - cursorPos.x) * 0.22;
        cursorPos.y += (pointer.y - cursorPos.y) * 0.22;
        cursor.style.transform = `translate3d(${cursorPos.x}px, ${cursorPos.y}px, 0)`;
        cursorDot.style.transform = `translate3d(${pointer.x}px, ${pointer.y}px, 0)`;
    }

    document.querySelectorAll('.magnetic').forEach((el) => {
        if (!FINE_POINTER || REDUCED) return;
        el.addEventListener('pointermove', (e) => {
            const r = el.getBoundingClientRect();
            const dx = (e.clientX - (r.left + r.width / 2)) / r.width;
            const dy = (e.clientY - (r.top + r.height / 2)) / r.height;
            el.style.translate = `${(dx * 10).toFixed(1)}px ${(dy * 8).toFixed(1)}px`;
        });
        el.addEventListener('pointerleave', () => { el.style.translate = ''; });
    });

    main.addEventListener('pointerdown', (e) => {
        state.impulse = Math.min(1.2, state.impulse + 0.7);
        if (REDUCED) return;
        const r = document.createElement('span');
        r.className = 'ripple';
        r.style.left = e.clientX + 'px';
        r.style.top = e.clientY + 'px';
        body.appendChild(r);
        r.addEventListener('animationend', () => r.remove());
    });

    /* ================= Card 3D: tilt + fluttuazione ================= */
    const tilt = { x: 0, y: 0 };
    function updateCard(t) {
        if (!state.entered) return;
        const tx = REDUCED ? 0 : -state.mouseY * 9;
        const ty = REDUCED ? 0 : state.mouseX * 12;
        tilt.x += (tx - tilt.x) * 0.07;
        tilt.y += (ty - tilt.y) * 0.07;
        const float = REDUCED ? 0 : Math.sin(t * 1.1) * 6;
        card.style.transform =
            `translateY(${float.toFixed(2)}px) rotateX(${tilt.x.toFixed(2)}deg) rotateY(${tilt.y.toFixed(2)}deg)`;
        card.style.setProperty('--bass', state.bass.toFixed(3));
        card.style.setProperty('--hx', (50 + tilt.y * 4).toFixed(1) + '%');
        card.style.setProperty('--hy', (50 - tilt.x * 4).toFixed(1) + '%');
    }

    /* ================= Testi animati ================= */
    function scramble(el, finalText, duration) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&@$';
        const start = performance.now();
        (function step(now) {
            const p = Math.min((now - start) / duration, 1);
            const revealed = Math.floor(p * finalText.length);
            let s = '';
            for (let i = 0; i < finalText.length; i++) {
                s += i < revealed ? finalText[i] : chars[(Math.random() * chars.length) | 0];
            }
            el.textContent = s;
            el.dataset.text = s;
            if (p < 1) requestAnimationFrame(step);
        })(start);
    }

    const phrases = ['INFO MAIK', 'TIKTOK // @maikbarre24', 'DISCORD // MAIKTHEBLAK', 'BENVENUTO NEL MIO MONDO'];
    function startTyping() {
        const el = $('#typed');
        let pi = 0, ci = phrases[0].length, deleting = true;
        (function tick() {
            const word = phrases[pi];
            if (deleting) {
                el.textContent = word.slice(0, --ci);
                if (ci <= 0) {
                    deleting = false;
                    pi = (pi + 1) % phrases.length;
                    return setTimeout(tick, 320);
                }
                return setTimeout(tick, 28);
            }
            el.textContent = phrases[pi].slice(0, ++ci);
            if (ci >= phrases[pi].length) {
                deleting = true;
                return setTimeout(tick, 2000);
            }
            setTimeout(tick, 55 + Math.random() * 45);
        })();
    }

    function scheduleGlitch() {
        if (REDUCED) return;
        setTimeout(() => {
            const targets = state.entered
                ? [$('#name'), avatar]
                : [$('.boot-brand'), $('.enter-label')];
            targets.forEach((el) => {
                el.classList.add('glitching');
                setTimeout(() => el.classList.remove('glitching'), 440);
            });
            scheduleGlitch();
        }, 1800 + Math.random() * 3600);
    }
    scheduleGlitch();

    const clockEl = $('#clock');
    const pad = (n) => String(n).padStart(2, '0');
    function tickClock() {
        const d = new Date();
        clockEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    tickClock();
    setInterval(tickClock, 1000);

    /* ================= Toast + copia username ================= */
    const toastEl = $('#toast');
    let toastTimer = 0;
    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2300);
    }

    function legacyCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
        ta.remove();
        return ok;
    }
    function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
        }
        return Promise.resolve(legacyCopy(text));
    }
    $('#copy-discord').addEventListener('click', (e) => {
        const text = e.currentTarget.dataset.copy;
        copyText(text).then((ok) => toast(ok ? `Username ${text} copiato!` : `Username Discord: ${text}`));
    });

    document.querySelectorAll('a[data-social]').forEach((a) => {
        if ((a.getAttribute('href') || '').trim()) return;
        a.addEventListener('click', (e) => {
            e.preventDefault();
            toast(`Link ${a.dataset.social} in arrivo!`);
        });
    });

    /* ================= Boot + ingresso ================= */
    const bootLog = $('#boot-log');
    const bootBar = $('#boot-bar');
    const bootSteps = [
        ['INIZIALIZZAZIONE SISTEMA', 'OK'],
        ['CARICAMENTO PROFILO // MAIKBARRE', 'OK'],
        ['MOTORE GRAFICO 3D', scene3d ? 'WEBGL OK' : 'MODALITÀ LITE'],
        ['MODULO AUDIO', state.audioFailed ? 'OFFLINE' : 'PRONTO'],
        ['CONNESSIONE CRITTOGRAFATA', 'STABILE'],
    ];
    let bootIndex = 0;

    function bootNext() {
        if (state.entered) return;
        if (bootIndex >= bootSteps.length) {
            intro.classList.add('ready');
            return;
        }
        const [label, status] = bootSteps[bootIndex++];
        const line = document.createElement('div');
        line.className = 'boot-line';
        const lbl = document.createElement('span');
        const ok = document.createElement('span');
        ok.className = 'ok';
        line.append(lbl, ok);
        bootLog.appendChild(line);
        const text = '> ' + label;
        let i = 0;
        (function type() {
            if (state.entered) return;
            lbl.textContent = text.slice(0, ++i);
            if (i < text.length) return setTimeout(type, REDUCED ? 0 : 16);
            ok.textContent = `[${status}]`;
            bootBar.style.width = ((bootIndex / bootSteps.length) * 100) + '%';
            setTimeout(bootNext, REDUCED ? 0 : 170);
        })();
    }
    setTimeout(bootNext, 300);

    function enter() {
        if (state.entered) return;
        state.entered = true;

        requestGyro();
        setupAudioGraph();
        applyVolume(parseFloat(volume.value));
        playAudio();
        const vp = video.play();
        if (vp && vp.catch) vp.catch(() => {});

        const flash = $('#flash');
        if (!REDUCED) flash.classList.add('go');
        intro.classList.add('leaving');
        setTimeout(() => { intro.hidden = true; flash.classList.remove('go'); }, 1200);

        main.classList.add('visible');
        main.focus({ preventScroll: true });
        body.classList.add('entered');
        state.impulse = 1;
        if (scene3d) scene3d.warp(performance.now() / 1000);

        if (!REDUCED) setTimeout(() => scramble($('#name'), 'MAIKBARRE', 1300), 800);
        setTimeout(startTyping, REDUCED ? 0 : 2600);
    }

    intro.addEventListener('click', enter);
    intro.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            enter();
        }
    });
    intro.focus({ preventScroll: true });

    /* ================= Loop principale ================= */
    addEventListener('resize', () => {
        if (scene3d) scene3d.resize();
        sizeViz();
    });
    sizeViz();

    let last = performance.now();
    function loop(nowMs) {
        const dt = Math.min((nowMs - last) / 1000, 0.05);
        last = nowMs;
        const t = nowMs / 1000;
        sampleAudio(t);
        state.impulse *= Math.exp(-dt * 2.5);
        updateCard(t);
        updateCursor();
        if (state.entered) drawViz(t);
        if (scene3d) scene3d.update(dt, t);
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
