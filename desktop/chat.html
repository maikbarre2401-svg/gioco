<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Parla con Zeph</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#101827; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding:12px; }
  #row { display:flex; gap:8px; }
  #msg { flex:1; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08);
    color:#fff; border-radius:10px; padding:10px 13px; font-size:14px; outline:none; }
  #msg::placeholder { color:rgba(255,255,255,.45); }
  #msg:focus { border-color:#5eead4; }
  #send { border:none; background:#14b8a6; color:#04222c; font-weight:700; font-size:14px;
    border-radius:10px; padding:0 18px; cursor:pointer; }
  #send:hover { filter:brightness(1.15); }
  #hint { color:rgba(255,255,255,.5); font-size:11px; margin-top:8px; }
</style>
</head>
<body>
<div id="row">
  <input id="msg" type="text" placeholder="Scrivi a Zeph… (es. «apri youtube», «balla», «seguimi»)" autocomplete="off" autofocus>
  <button id="send">Invia</button>
</div>
<div id="hint">Risponde a voce. Prova: «apri calcolatrice», «cerca ricette pasta», «manda messaggio arrivo tra poco», «ricordami tra 10 minuti della pizza», «salto mortale».</div>
<script>
  const msg = document.getElementById('msg');
  function send() {
    const t = msg.value.trim();
    if (!t) return;
    msg.value = '';
    if (window.zephBridge) window.zephBridge.sendChat(t);
  }
  document.getElementById('send').addEventListener('click', send);
  msg.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
